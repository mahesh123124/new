<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Redirect</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <main class="container">

        <div class="logo">
            ↗
        </div>

        <h1>Smart Redirect</h1>

        <p class="subtitle">
            Enter a URL and redirect to it instantly.
        </p>

        <div class="redirect-box">

            <input
                type="text"
                id="urlInput"
                placeholder="https://example.com"
            >

            <button onclick="redirectUser()">
                Redirect
            </button>

        </div>

        <p id="message"></p>

        <div class="features">

            <div class="feature">
                <span>⚡</span>
                <div>
                    <h3>Fast</h3>
                    <p>Instant redirection</p>
                </div>
            </div>

            <div class="feature">
                <span>🔒</span>
                <div>
                    <h3>Simple</h3>
                    <p>Easy to use</p>
                </div>
            </div>

            <div class="feature">
                <span>🌐</span>
                <div>
                    <h3>Universal</h3>
                    <p>Works with any URL</p>
                </div>
            </div>

        </div>

    </main>

    <footer>
        <p>Smart Redirect © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
